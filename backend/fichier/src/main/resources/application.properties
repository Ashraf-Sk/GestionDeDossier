spring.application.name=fichier
server.port= 8000
spring.datasource.username=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/dossiersig
spring.datasource.password=postgres
spring.datasource.driver-class-name= org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update


# Configuration pour l'upload de fichiers
# Limite par fichier : 20MB (pour les documents PDF, images, etc.)
spring.servlet.multipart.max-file-size=20MB
# Limite totale de la requête : 50MB (pour permettre plusieurs fichiers)
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

document.upload.dir=./uploads
logging.level.org.springframework.security=DEBUG
logging.level.app.fichier.interceptors=DEBUG
logging.level.app.fichier.Utils=DEBUG
logging.level.app.fichier.Service=DEBUG


